<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>コーチ紹介｜GAO卓球場</title>
<meta name="description" content="GAO卓球場のコーチ紹介。目的やレベルに合わせて、実戦につながる卓球レッスンをサポートします。">
<style>
:root{--bg:#0d0f12;--panel:#15181d;--text:#f6f7f8;--muted:#aeb6c0;--accent:#f1d45d;--max:1120px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.7}
a{color:inherit;text-decoration:none}.wrap{width:min(var(--max),calc(100% - 36px));margin:auto}
nav{position:sticky;top:0;z-index:20;background:rgba(13,15,18,.9);backdrop-filter:blur(14px);border-bottom:1px solid #2a2e34}
.navin{height:70px;display:flex;align-items:center;justify-content:space-between;gap:15px}.logo{font-weight:900;letter-spacing:.08em}.links{display:flex;gap:12px;align-items:center}
.btn{border:0;border-radius:999px;padding:13px 20px;background:var(--accent);color:#151515;font-weight:800;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.btn.ghost{background:transparent;color:#fff;border:1px solid #3a414a}
.hero{padding:88px 0 56px;background:radial-gradient(circle at 82% 12%,rgba(241,212,93,.15),transparent 32%)}
.kicker{color:var(--accent);font-weight:800;letter-spacing:.1em;font-size:13px}
h1{font-size:clamp(44px,7vw,76px);line-height:1.04;margin:12px 0 18px;letter-spacing:-.045em}
.hero p{max-width:750px;color:#c9d0d8;font-size:18px}
section{padding:42px 0 84px}
.coaches{display:grid;gap:22px}
.coach{display:grid;grid-template-columns:280px 1fr;background:var(--panel);border:1px solid #2a3038;border-radius:28px;overflow:hidden}
.photo{min-height:350px;background:linear-gradient(145deg,#282f38,#111419);display:grid;place-items:center;text-align:center;color:#98a1ad;padding:20px}
.photo .mark{font-size:72px}
.info{padding:34px}.role{display:inline-block;border:1px solid #3a414b;border-radius:999px;padding:5px 11px;color:#dbe1e7;font-size:12px}
h2{font-size:34px;margin:12px 0 2px}.roman{color:#9ca6b1;margin-bottom:18px}.quote{font-size:20px;font-weight:750;line-height:1.55;margin:18px 0 24px}
ul{padding-left:20px;color:#cbd2da}.lang{margin-top:20px;background:#20252c;border-radius:15px;padding:14px 16px;color:#e4e8ec}
.cta{margin-top:30px;padding:30px;background:#fff;color:#111;border-radius:25px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.cta p{margin:4px 0;color:#5e6670}
@media(max-width:760px){.coach{grid-template-columns:1fr}.photo{min-height:210px}.links .ghost{display:none}.cta{display:block}.cta .btn{margin-top:15px;width:100%}}
</style>
</head>
<body>
<script src="content.js"></script>
<nav><div class="wrap navin">
  <a class="logo" href="index.html">GAO卓球場</a>
  <div class="links"><a class="btn ghost" href="shop.html">卓球用品</a><a class="btn" href="index.html#trial">体験レッスン</a></div>
</div></nav>

<header class="hero"><div class="wrap">
  <div class="kicker">コーチ紹介</div>
  <h1>教える人が違えば、<br>気づけることも違う。</h1>
  <p>技術、身体の使い方、戦術、試合での考え方。GAOではひとつの正解を押しつけるのではなく、プレースタイルや目的に合わせて一緒に上達の方法を探します。</p>
</div></header>

<section><div class="wrap">
  <div class="coaches" id="coachList"></div>

  <div class="cta">
    <div>
      <div class="kicker" style="color:#806900">まずは体験から</div>
      <h3 style="font-size:25px;margin:5px 0">45分の体験レッスン</h3>
      <p>15分の対面相談 + 30分の1対1レッスン。Instagramフォローで1,000円OFF。</p>
    </div>
    <a class="btn" id="lineBtn" href="#">LINEで相談する</a>
  </div>
</div></section>

<script>
function renderCoaches(){
  const root=document.getElementById("coachList");
  root.innerHTML=GAO_CONTENT.コーチ.map((c,i)=>`
    <article class="coach">
      <div class="photo">
        <div>
          <div class="mark">🏓</div>
          <div>コーチ写真をここに追加</div>
        </div>
      </div>
      <div class="info">
        <span class="role">${c.役割}</span>
        <h2>${c.日本語名}</h2>
        <div class="roman">${c.名前}</div>
        <div class="quote">「${c.一言}」</div>
        <ul>${c.プロフィール.map(x=>`<li>${x}</li>`).join("")}</ul>
        ${i===0?'<div class="lang"><b>3言語対応</b><br>日本語・中国語・英語でのコミュニケーションに対応。</div>':''}
      </div>
    </article>`).join("");
}
renderCoaches();
document.getElementById("lineBtn").onclick=(e)=>{e.preventDefault();window.open(GAO_CONTENT.SNS.LINEリンク,"_blank","noopener")}
</script>
</body>
</html>
